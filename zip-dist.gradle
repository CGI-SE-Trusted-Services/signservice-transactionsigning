tasks.register('zipDist', Zip) {
    def projectBaseName = project.name + "-${project.ext.get('shortVersionNumber')}"
    def folderName = projectBaseName + '-dist'
    archiveFileName = folderName + '.zip'

    from(projectDir) {
        include('THIRD-PARTY-NOTICES')
        include('LICENSE')
        into(folderName)
    }
    from("build/docs/transactionsigning_changelog_doc/") {
        include("**/*.pdf")
        eachFile { it.path = "${folderName}/${it.name}" }
        includeEmptyDirs = false
        into(folderName)
    }
    from("build/docs/transactionsigning_readme_doc/") {
        include("**/*.pdf")
        eachFile { it.path = "${folderName}/${it.name}" }
        includeEmptyDirs = false
        into(folderName)
    }

    from(tasks.jar) {
        into("${folderName}/lib")
    }
    from(configurations.runtimeClasspath) {
        into("${folderName}/lib")
    }
    from('build/docs/html5') {
        into(folderName + "/docs")
    }
}
